<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - AMES</title>
    <link rel="stylesheet" href="/contact.css">
    <link rel="shortcut icon" href="/Img/logoN.png">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="/"><img src="./Img/logo.png" alt="AMES"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="http://www.ames-pro.fr/">Accueil</a></li>
                    <li><a href="https://ames-pro.vercel.app/projects-list">Planification</a></li>
                    <li><a href="https://ames-pro.vercel.app/contact">Contact</a></li>
                    <li><a href="" class="log" id="log"><i class="fas fa-user"></i></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="contact-form">
            <h2>Contactez-moi</h2>
            <form>
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Envoyer</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <p class="social-text">Suivez-moi</p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/alain-mathon-0a416b89/" target="_blank">
                    <i class="fab fa-linkedin"></i>
                </a>
            </div>
            <nav class="footer-nav">
                <ul>
                    <li><a href="http://www.ames-pro.fr/">Accueil</a></li>
                    <li><a href="https://ames-pro.vercel.app/projects-list">Planification</a></li>
                    <li><a href="https://ames-pro.vercel.app/contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </footer>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        async function CheckToken(){
    const users = await fetch("https://ames-database.vercel.app/getUser")
    const infoUsers = await users.json()
    let AllId = []
    infoUsers.forEach(element => {
        AllId.push(element._id)
    });
    console.log(AllId)

    const token = localStorage.getItem('token')

    console.log(localStorage.getItem('token'))
    getUser(token)
}        

CheckToken()

async function getUser(token) {
    const response = await fetch('/api/users/me', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json',
            'x-auth-token': token 
        }
    });

    if (response.ok) {                
        // document.getElementById("login").style.display = "none"
        // document.getElementById("logout").style.display = "block"
        document.getElementById("log").href = "https://ames-pro.vercel.app/logout"
        const userData = await response.json();
        console.log(userData);
    } else {
        document.getElementById("log").href = "https://ames-pro.vercel.app/login"
        console.log('Failed to fetch user data');
    }
}
    </script>
</body>
</html>
